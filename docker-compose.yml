services:
  onlyoffice:
    # Pinned by tag and digest (EDIT-1.3, ADR 2026-10-17-onlyoffice-release-and-licence). Change only through a battery run.
    image: onlyoffice/documentserver:10.0.0.1@sha256:ca17889f10b11141cc6441836aebdd2835cf3e1b49681b2fd6e155c94b7850b3
    ports:
      - "127.0.0.1:8080:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-dev-only-secret-do-not-use-in-prod}
      # No marketplace plugins downloaded or installed at start (ADR F5).
      - PLUGINS_ENABLED=false
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-log:/var/log/onlyoffice
      # Server-side AI off (ADR F4); configuration only, the image is unmodified.
      - ./infrastructure/onlyoffice/local-production-linux.json:/etc/onlyoffice/documentserver/local-production-linux.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Notification secrets have consumer-specific names (EDITOR_NOTIFY_SECRET_<CONSUMER>, E4), so the
    # VM's .env reaches the API whole. Optional, so a fresh checkout still starts.
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:3020:3020"
    environment:
      - PORT=3020
      - HOST=0.0.0.0
      - NODE_ENV=${NODE_ENV:-development}
      # Unset means production rules (E4); only set to `local` on a developer machine.
      - EDITOR_ENV
      - EDITOR_SEAL_KEYS
      - ONLYOFFICE_CALLBACK_URL_ORIGINS
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ONLYOFFICE_URL=http://onlyoffice:80
      - ONLYOFFICE_PUBLIC_URL=${ONLYOFFICE_PUBLIC_URL:-http://localhost:8080}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-dev-only-secret-do-not-use-in-prod}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-http://localhost:3020}
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://api:3020}
      - CONSUMERS=${CONSUMERS:-}
      - CONSUMER_API_KEY=${CONSUMER_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
    depends_on:
      onlyoffice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3020/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  onlyoffice-data:
  onlyoffice-log:
