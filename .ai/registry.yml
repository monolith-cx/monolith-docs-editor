    notes: "Drafted, plan-reviewed (attempt 2 PASS-WITH-NITS, nits applied), and owner-approved 2026-10-16 with parent amendments A1-A5. EDIT-4 (log redaction) code-complete and checkpoint-reviewed 2026-10-16. 2026-10-17: its deploy survey found no hosted editor anywhere (VMs and IP deleted 2026-06-12, snapshots kept), so EDIT-4 ships with the EDIT-6 stand-up and there was no live log to purge; Cloudflare logging check blocked. EDIT-1 (2026-10-17): repeatable battery scripts/editor-battery/ run in full on the pinned 10.0.0.1 (24 pass, 4 pass-with-finding for the loose lock, 7 recorded, 1 blocked: Word desktop, waived by Josh 2026-10-18; EDIT-1 done, committed dfbb48e); ADR docs/adr/2026-10-17-onlyoffice-release-and-licence.md F1-F15; checkpoint review attempt 2 PASS-WITH-NITS, nits applied. EDIT-2 (UDOC-1.2) code-complete 2026-10-18, not deployed: profiles, stateless sealed sessions, the source route (DocumentServer fetches through the service, pinned), signed notifications, drop, forgotten files, the editor page, DocumentServer AI and plugins off by configuration; 192 API tests; battery 2026-10-18-0834 (full, 0 fail) and -partial-0940 (service items on the final code, all pass); review attempt 3 PASS-WITH-NITS from Sonnet and Codex (DeepSeek unavailable), attempt-4 verification PASS-WITH-NITS, every finding applied; ADR F16 added; consumer guide docs/guides/consumer-integration.md; Platform contract draft document-editing.md 0.1.0-draft. EDIT-3 (UDOC-1.3) code-complete 2026-10-18, not deployed: POST /api/documents/convert through the source route and a pinned upload; ADR F17 found (DocumentServer's single converter wedges on a partial or slow source download) and mitigated by reading every source whole; 220 API tests; battery 2026-10-18-partial-2002 (all service items, 10 pass); review attempt 3 PASS (Codex) and PASS-WITH-NITS (Sonnet), every finding applied. EDIT-5 (UDOC-1.5) code-complete 2026-10-18, not deployed: the panel bridge plugin apps/plugin/ (plain JavaScript, no build step, no runtime dependencies, scripts/check-plugin-deps.mjs as its lint) served by the API from /plugins/udoc-bridge/ with ADR F18's CSP; protocol 1, six operations, anchors re-verified inside one callCommand; TRUST_PROXY judged on proxy-addr's compiled function, X-Forwarded-Host dropped; 230 API tests, 38 plugin tests; battery 2026-10-18-partial-2242 plus -partial-2302 and -partial-2312, all pass; review attempt 3 PASS-WITH-NITS from Sonnet and Codex (attempts 1 and 2 FAIL), every finding applied; Platform contract document-editing.md 0.3.0-draft §6. EDIT-6 (UDOC-1.6): hosting decided by Josh 2026-10-18 (guidance E9: the OVH VPS, monolith-dev compose project, editor-dev.monolith.cx behind the shared Caddy; GCE not chosen, GCP compute exited); 6.1-6.5 code-complete 2026-10-18: DocumentServer directIfIn allow-list http://editor-api:3020/ with private addresses refused, maxprocesscount 2, the loopback-only converter probe and the host watchdog (infrastructure/vps/editor-converter-watch.sh), capacity measured (DocumentServer ~370 MiB, API <40 MiB with six editors), infrastructure/vps/ (compose fragment, Caddy block, env template, runbook); ADR docs/adr/2026-10-18-editor-hosting.md; battery 2026-10-19-partial-0057 and -0022; Sonnet review attempt 1 PASS-WITH-NITS, every finding applied, attempt 2 PASS-WITH-NITS (2 Low, 9 nits, all applied). EDIT-6.6 (the dev stand-up) done 2026-11-02. Next: EDIT-2.9, then EDIT-6.7. Implements UDOC-1.1-1.7 exactly (EDIT-n = UDOC-1.n): latest OnlyOffice Community and a repeatable battery re-run, named profiles, stateless per-open sessions in sealed editor URLs, signed and retried consumer notifications, drop, PDF conversion, log redaction, the panel bridge plugin, hosting, licence posture. Keeps fastmail-connect and the Connect extension working on the legacy open shape (E1) until they migrate."

