cript, no build step, no runtime dependencies, scripts/check-plugin-deps.mjs as its lint) served by the API from /plugins/udoc-bridge/ with ADR F18's CSP; protocol 1, six operations, anchors re-verified inside one callCommand; TRUST_PROXY judged on proxy-addr's compiled function, X-Forwarded-Host dropped; 230 API tests, 38 plugin tests; battery 2026-10-18-partial-2242 plus -partial-2302 and -partial-2312, all pass; review attempt 3 PASS-WITH-NITS from Sonnet and Codex (attempts 1 and 2 FAIL), every finding applied; Platform contract document-editing.md 0.3.0-draft §6. EDIT-6 (UDOC-1.6): hosting decided by Josh 2026-10-18 (guidance E9: the OVH VPS, monolith-dev compose project, editor-dev.monolith.cx behind the shared Caddy; GCE not chosen, GCP compute exited); 6.1-6.5 code-complete 2026-10-18: DocumentServer directIfIn allow-list http://editor-api:3020/ with private addresses refused, maxprocesscount 2, the loopback-only converter probe and the host watchdog (infrastructure/vps/editor-converter-watch.sh), capacity measured (DocumentServer ~370 MiB, API <40 MiB with six editors), infrastructure/vps/ (compose fragment, Caddy block, env template, runbook); ADR docs/adr/2026-10-18-editor-hosting.md; battery 2026-10-19-partial-0057 and -0022; Sonnet review attempt 1 PASS-WITH-NITS, every finding applied, attempt 2 PASS-WITH-NITS (2 Low, 9 nits, all applied). Next: EDIT-6.6, the VPS stand-up, each step with Josh's approval. Implements UDOC-1.1-1.7 exactly (EDIT-n = UDOC-1.n): latest OnlyOffice Community and a repeatable battery re-run, named profiles, stateless per-open sessions in sealed editor URLs, signed and retried consumer notifications, drop, PDF conversion, log redaction, the panel bridge plugin, hosting, licence posture. Keeps fastmail-connect and the Connect extension working on the legacy open shape (E1) until they migrate."

