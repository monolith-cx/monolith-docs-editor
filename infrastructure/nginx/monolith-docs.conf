# Monolith Docs — NGINX reverse proxy config
# Serves app.monolithdocs.com (public-facing editor + OnlyOffice assets)
# API endpoints are NOT exposed here — they go through Cloudflare Tunnel
#
# Setup:
#   1. Copy to /etc/nginx/sites-available/monolith-docs.conf
#   2. ln -s /etc/nginx/sites-available/monolith-docs.conf /etc/nginx/sites-enabled/
#   3. Place Cloudflare origin certificate at /etc/ssl/cloudflare/origin.pem
#   4. Place Cloudflare origin private key at /etc/ssl/cloudflare/origin.key
#   5. nginx -t && systemctl reload nginx

# Access logs never record a capability (EDIT-4.2 / UDOC-1.4). Editor pages,
# DocumentServer's cache files, downloads, prints, uploads, and co-editing paths
# carry the document key (the editor's capability today, a sealed session token
# after EDIT-2), and query strings carry signatures (`md5=`, `X-Goog-Signature=`).
# The map is an allowlist: only the health check and DocumentServer's static
# asset routes (the same pattern as its own ds-docservice.conf) are logged as
# they are; every other path keeps only its first segment. `$uri` never carries
# the query string, and the Referer is not logged because it holds the editor
# page URL.
#
# Residual (ERRORS.md, 2026-10-16): nginx's error log writes the raw request
# line, query included, on upstream errors and cannot be formatted. It is kept
# at `error` (explicit below) for diagnosis and is in the log purge's scope
# (EDIT-4.3).
map $uri $monolith_docs_log_path {
    /health                                                                                     /health;
    ~^(/[0-9]+\.[0-9]+\.[0-9]+[.-][A-Za-z0-9_]+)?/(web-apps|sdkjs|sdkjs-plugins|fonts|dictionaries)/   $uri;
    ~^(/[0-9]+\.[0-9]+\.[0-9]+[.-][A-Za-z0-9_]+)?/document_editor_service_worker\.js$              $uri;
    ~^/(?<monolith_docs_first_segment>[^/]+)/                                                   /$monolith_docs_first_segment/[redacted];
    default                                                                                     /[redacted];
}

log_format monolith_docs_masked '$remote_addr [$time_local] "$request_method $monolith_docs_log_path $server_protocol" '
                                '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream onlyoffice {
    server 127.0.0.1:8080;
}

upstream api {
    server 127.0.0.1:3020;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name app.monolithdocs.com;
    access_log /var/log/nginx/monolith-docs.access.log monolith_docs_masked;
    error_log /var/log/nginx/monolith-docs.error.log error;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.monolithdocs.com;
    access_log /var/log/nginx/monolith-docs.access.log monolith_docs_masked;
    error_log /var/log/nginx/monolith-docs.error.log error;

    # Cloudflare origin certificate (15-year validity, no renewal needed)
    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers (defense in depth — also set by Fastify for API responses)
    # Note: X-Frame-Options is NOT set at the server level because /editor/ pages
    # must be embeddable in iframes by consuming apps. Fastify sets it per-route.
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # BLOCK /api/* from public access — API calls go through Cloudflare Tunnel
    # (connect.monolithdocs.com and crm.monolithdocs.com)
    location /api/ {
        default_type application/json;
        return 403 '{"error":"API access is not available on this hostname"}';
    }

    # Health check — public for uptime monitoring
    location = /health {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Editor pages — served by Fastify, session-bound URLs
    location /editor/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # OnlyOffice DocumentServer — editor assets, JS API, and WebSocket
    location / {
        proxy_pass http://onlyoffice;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support (required for real-time collaboration)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # OnlyOffice needs generous timeouts for long editing sessions
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # File upload size — OnlyOffice can handle large documents
    client_max_body_size 100m;
}
