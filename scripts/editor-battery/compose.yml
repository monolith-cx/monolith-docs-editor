# Scratch stack for the editor battery (EDIT-1.2). Loopback-only ports; random
# secrets come from the runner's environment and are never written to disk.
name: editor-battery

services:
  ds:
    image: ${BATTERY_DS_IMAGE:?set by the runner}
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${BATTERY_JWT_SECRET:?set by the runner}
      JWT_HEADER: Authorization
      ALLOW_PRIVATE_IP_ADDRESS: ${BATTERY_ALLOW_PRIVATE_IP:-true}
      # The service's production hardening (ADR F4, F5): no marketplace plugins, AI off.
      PLUGINS_ENABLED: "false"
    volumes:
      - ../../infrastructure/onlyoffice/local-production-linux.json:/etc/onlyoffice/documentserver/local-production-linux.json:ro
    ports:
      - "127.0.0.1:18200:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  stub:
    image: node:24-alpine
    working_dir: /stub
    command: ["node", "server.mjs"]
    environment:
      BATTERY_JWT_SECRET: ${BATTERY_JWT_SECRET:?set by the runner}
      BATTERY_NOTIFY_SECRET: ${BATTERY_NOTIFY_SECRET:?set by the runner}
      DS_INTERNAL: http://ds
      DS_PUBLIC: http://127.0.0.1:18200
    volumes:
      - ./stub:/stub:ro
      - ./.work:/work
    ports:
      - "127.0.0.1:18201:18201"
      - "127.0.0.1:18202:18202"
      - "127.0.0.1:18203:18203"

  # The service itself, built from this repo, for round trips through apps/api (EDIT-1.3).
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "3020"
      HOST: 0.0.0.0
      NODE_ENV: development
      LOG_LEVEL: info
      ONLYOFFICE_URL: http://ds
      ONLYOFFICE_PUBLIC_URL: http://127.0.0.1:18200
      ONLYOFFICE_JWT_SECRET: ${BATTERY_JWT_SECRET:?set by the runner}
      API_PUBLIC_URL: http://127.0.0.1:18204
      API_INTERNAL_URL: http://api:3020
      # EDITOR_ENV=local admits http and private addresses (the scratch network) and api-key consumers.
      EDITOR_ENV: local
      EDITOR_SEAL_KEYS: ${BATTERY_SEAL_KEY:?set by the runner}
      EDITOR_NOTIFY_SECRET_BATTERY: ${BATTERY_NOTIFY_SECRET:?set by the runner}
      CONSUMERS: >-
        [{"id":"battery","name":"Battery consumer","auth":{"mode":"api-key","key":"${BATTERY_API_KEY:?set by the runner}"},
          "profiles":["document","template","view"],"callbackUrl":"http://stub:18201/consumer-callback",
          "notificationSecretRef":"EDITOR_NOTIFY_SECRET_BATTERY","panelOrigins":["http://127.0.0.1:18202"],
          "fileHosts":["stub"],"convertSourceHosts":["stub"],"convertUploadHosts":["stub"],"returnOrigin":"http://127.0.0.1:18201"},
         {"id":"legacy","name":"Legacy-shape consumer","auth":{"mode":"api-key","key":"${BATTERY_LEGACY_KEY:?set by the runner}"}}]
    ports:
      - "127.0.0.1:18204:3020"
    depends_on:
      ds:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3020/health"]
      interval: 5s
      timeout: 5s
      retries: 30
