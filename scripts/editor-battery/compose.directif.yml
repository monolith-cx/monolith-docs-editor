# Override used only by battery item U12: turns off DocumentServer's "fetch URLs from
# JWT-signed requests directly" switch, to show what its private-address filter does
# when that bypass is off. Configuration only; the image is unmodified.
services:
  ds:
    volumes:
      - ./.work/ds-local-override.json:/etc/onlyoffice/documentserver/local-production-linux.json:ro
